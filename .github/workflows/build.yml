name: Build SessionChecker
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: bash build.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: SessionChecker-${{ matrix.os }}
          path: dist/SessionChecker
